<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        h1 {
            color: #16744a;
        }

        p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Application Submitted</h1>

    <p>
        Thank you for submitting your application.
        Your application has been received successfully.
    </p>

    <p>
        If additional documentation is required, you will be contacted
        through the email address provided in your application.
    </p>
</div>

</body>
</html>
